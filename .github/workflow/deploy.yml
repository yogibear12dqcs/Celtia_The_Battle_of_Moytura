name: Build and Deploy Celtia

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux

    env:
      PROJECT: CeltiaGame/CeltiaGame.csproj
      PUBLISH_DIR: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore $PROJECT

      - name: Build
        run: dotnet build $PROJECT -c Release --no-restore

      - name: Publish
        run: dotnet publish $PROJECT -c Release -o $PUBLISH_DIR --no-build

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: CeltiaTheBattleofMoytura
          package: publish
